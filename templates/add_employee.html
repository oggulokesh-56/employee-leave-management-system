<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="top-nav">
        <h2>Add New Employee</h2>
        <a href="/admin/employees" class="sub-btn">Back to Employees</a>
    </div>

    <div class="page-box">
        <div class="card-box" style="max-width: 600px; margin: 0 auto;">
            <h3>Employee Form</h3>
            
            <form action="/admin/employees/add" method="POST">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" name="name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" name="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Job Title:</label>
                    <input type="text" name="job_title" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" name="phone_number" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Start Date:</label>
                    <input type="date" name="start_date" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Manager Name:</label>
                    <input type="text" name="manager_name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Status:</label>
                    <select name="status" class="form-input">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <button type="submit" class="main-btn" style="width: 100%;">Create Employee</button>
            </form>
        </div>
    </div>

</body>
</html>
